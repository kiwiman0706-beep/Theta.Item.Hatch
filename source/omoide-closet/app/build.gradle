plugins { id 'com.android.application' }

def personalKeystore = file('../signing/omoide-closet.jks')
def personalStorePassword = System.getenv('OMOIDE_STORE_PASSWORD')

android {
    namespace 'jp.omoide.closet'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.omoide.closet'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        testInstrumentationRunner 'jp.omoide.closet.SmokeInstrumentation'
    }
    signingConfigs {
        personal {
            if (personalKeystore.exists() && personalStorePassword) {
                storeFile personalKeystore
                storePassword personalStorePassword
                keyAlias System.getenv('OMOIDE_KEY_ALIAS') ?: 'omoide'
                keyPassword System.getenv('OMOIDE_KEY_PASSWORD') ?: personalStorePassword
            }
        }
    }
    buildTypes {
        release {
            if (personalKeystore.exists() && personalStorePassword) signingConfig signingConfigs.personal
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
