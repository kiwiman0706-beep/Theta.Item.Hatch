name: release-apk

# Publishes an already-signed APK from releases/ as a GitHub Release.
# The signing key is NOT in this repository (see docs/08_DATA_AND_SIGNING_NOT_INCLUDED.md),
# so CI never signs anything: it only verifies that the committed APK is signed by
# the same certificate as every earlier release, then attaches it.
#
#   1. Push a tag like v1.3.0, or
#   2. Run this workflow manually with a `version` input (the tag is created).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create & release (e.g. v1.3.0)'
        required: true
        default: v1.3.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
  # Distribution certificate of jp.omoide.closet (docs/04_BUILD_TEST_AND_SIGNING.md).
  # A mismatch means the APK would not install over the existing app — fail loudly.
  EXPECTED_CERT_SHA256: 29bf75206503a4da8a01f2de381cd7dc31187c9520d20967b232c8004a4aaa0c

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate APK
        run: |
          VERSION="${RELEASE_TAG#v}"
          APK="releases/omoide-closet-${VERSION}.apk"
          [ -f "$APK" ] || { echo "::error::$APK not found"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Verify signature and certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" verify.txt \
            || { echo "::error::Signing certificate differs from the distributed app"; exit 1; }
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt \
            || { echo "::error::APK versionName does not match tag $RELEASE_TAG"; exit 1; }

      - name: Checksums
        run: sha256sum "$APK" releases/omoide-closet-sample-album.html | sed 's#releases/##' > SHA256SUMS-release.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: おもいでクローゼット ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.RELEASE_TAG }}.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            ${{ env.APK }}
            releases/omoide-closet-sample-album.html
            SHA256SUMS-release.txt
